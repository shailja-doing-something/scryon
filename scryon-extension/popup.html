<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scryon Lens</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      min-height: 280px;
      background: #080810;
      color: #F0F0FF;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 20px 18px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid #2A2A45;
    }

    .logo-icon {
      font-size: 18px;
      background: linear-gradient(135deg, #7B5CF0, #A78BFA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: #F0F0FF;
      letter-spacing: -0.3px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3A3A5A;
    }

    .status-dot.connected { background: #22C55E; box-shadow: 0 0 5px #22C55E; }
    .status-dot.error { background: #EF4444; box-shadow: 0 0 5px #EF4444; }

    .status-label {
      font-size: 11px;
      color: #55557A;
    }

    .field {
      margin-bottom: 13px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #55557A;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      background: #16162A;
      border: 1px solid #2A2A45;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #F0F0FF;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: rgba(123, 92, 240, 0.5); }
    input::placeholder { color: #3A3A5A; }

    .toggle-pw {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #55557A;
      font-size: 11px;
      padding: 2px 4px;
    }

    .toggle-pw:hover { color: #8888AA; }

    .save-btn {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #7B5CF0, #A78BFA);
      transition: opacity 0.15s;
      margin-top: 4px;
    }

    .save-btn:hover { opacity: 0.9; }

    .msg {
      text-align: center;
      font-size: 12px;
      margin-top: 10px;
      height: 16px;
      color: #22C55E;
    }

    .hint {
      text-align: center;
      font-size: 11px;
      color: #3A3A5A;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #1E1E35;
      line-height: 1.5;
    }

    kbd {
      background: #16162A;
      border: 1px solid #2A2A45;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-family: inherit;
      color: #A78BFA;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo-icon">✦</span>
    <span class="logo-text">Scryon Lens</span>
    <div class="status-row">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-label" id="status-label">Checking…</span>
    </div>
  </div>

  <div class="field">
    <label for="scryon-url">Scryon URL</label>
    <input type="url" id="scryon-url" placeholder="https://your-app.railway.app" autocomplete="off" />
  </div>

  <div class="field">
    <label for="scryon-token">API Token</label>
    <div class="input-wrap">
      <input type="password" id="scryon-token" placeholder="Your EXTENSION_TOKEN value" autocomplete="off" />
      <button class="toggle-pw" id="toggle-pw" type="button">show</button>
    </div>
  </div>

  <button class="save-btn" id="save-btn">Save Settings</button>
  <div class="msg" id="msg"></div>

  <div class="hint">
    Press <kbd>Alt+S</kbd> on any tab to open Scryon Lens
  </div>

  <script src="popup.js"></script>
</body>
</html>
